# Fabrique Correcteur.exe sur une machine Windows fournie par GitHub.
#
# A chaque envoi sur la branche principale, l'executable est construit et
# depose dans l'onglet « Actions » du depot. Sur un tag « v1.2.3 », il est
# en plus publie dans les « Releases », pret a telecharger.
name: Correcteur.exe

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  construire:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dependances
        run: python -m pip install -r requirements-dev.txt

      - name: Lancer les tests
        run: python -m pytest tests/ -q

      - name: Compiler l'executable
        run: python -m PyInstaller --noconfirm --clean correcteur.spec

      - name: Verifier que l'executable corrige vraiment
        run: |
          $sortie = & dist\Correcteur.exe --texte "je sais pas si sa va marcher"
          if ($sortie -ne "je sais pas si ça va marcher") {
            throw "sortie inattendue : $sortie"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: Correcteur-exe
          path: dist/Correcteur.exe

      - name: Publier la version
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Correcteur.exe
