# Fabrique Correcteur.exe sur une machine Windows fournie par GitHub.
#
# A chaque envoi, sur n'importe quelle branche, l'executable est construit,
# teste, et depose dans l'onglet « Actions ».
#
# Sur « main », il est en plus publie dans les « Releases » sous un numero de
# version calcule tout seul : pas de tag a poser a la main, chaque envoi donne
# une version de plus.
name: Correcteur.exe

on:
  push:
  workflow_dispatch:

# Necessaire pour creer le tag et la release.
permissions:
  contents: write

jobs:
  construire:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Tout l'historique : le numero de version se deduit du nombre de
          # commits, qu'un clone superficiel ramenerait a 1.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dependances
        run: python -m pip install -r requirements-dev.txt

      - name: Lancer les tests
        run: python -m pytest tests/ -q

      - name: Compiler l'executable
        run: python -m PyInstaller --noconfirm --clean correcteur.spec

      # L'executable est compile en mode fenetre : sans redirection, il n'a
      # aucune sortie a offrir. « Start-Process -RedirectStandardOutput » lui
      # en fournit une, et attend qu'il ait fini. Attention, Start-Process
      # recolle ArgumentList avec des espaces : la phrase doit porter ses
      # propres guillemets pour rester un seul argument.
      - name: Verifier que l'executable corrige vraiment
        shell: pwsh
        run: |
          Start-Process -FilePath dist\Correcteur.exe `
            -ArgumentList '--texte', '"je sais pas si sa va marcher"' `
            -NoNewWindow -Wait `
            -RedirectStandardOutput sortie.txt -RedirectStandardError erreur.txt
          $sortie = "$(Get-Content sortie.txt -Raw -Encoding utf8)".Trim()
          if ($sortie -ne "je sais pas si ça va marcher") {
            Write-Host "--- sortie d'erreur ---"
            Get-Content erreur.txt -Raw -Encoding utf8
            throw "sortie inattendue : « $sortie »"
          }
          Write-Host "sortie conforme : $sortie"

      - uses: actions/upload-artifact@v4
        with:
          name: Correcteur-exe
          path: dist/Correcteur.exe

      # Le numero de version : « majeur.mineur » vient de __version__, le
      # dernier nombre est le nombre de commits. Il ne peut donc que monter,
      # et deux envois ne tomberont jamais sur le meme numero. Pour ouvrir une
      # nouvelle serie, il suffit de changer __version__ dans le code.
      - name: Calculer le numero de version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref }}".StartsWith("refs/tags/v")) {
            $tag = "${{ github.ref_name }}"
          } else {
            $init = Get-Content correcteur/__init__.py -Raw
            $serie = [regex]::Match($init, '__version__ = "(\d+\.\d+)')
            if (-not $serie.Success) { throw "__version__ introuvable" }
            $commits = (git rev-list --count HEAD).Trim()
            $tag = "v$($serie.Groups[1].Value).$commits"
          }
          Write-Host "version : $tag"
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Publier la version
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Correcteur ${{ steps.version.outputs.tag }}
          body: |
            Téléchargez **Correcteur.exe** ci-dessous, double-cliquez : une
            icône bleue apparaît près de l'horloge. Sélectionnez du texte
            n'importe où, puis `Ctrl+Alt+C`.

            Windows affichera un avertissement SmartScreen — l'exécutable
            n'est pas signé. *Informations complémentaires* → *Exécuter
            quand même*.
          generate_release_notes: true
          files: dist/Correcteur.exe
