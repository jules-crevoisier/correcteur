# Fabrique Papote.exe sur une machine Windows fournie par GitHub.
#
# A chaque envoi, sur n'importe quelle branche, l'executable est construit,
# teste, et depose dans l'onglet « Actions ».
#
# Sur « main », il est en plus publie dans les « Releases » sous un numero de
# version calcule tout seul : pas de tag a poser a la main, chaque envoi donne
# une version de plus.
name: Papote.exe

on:
  push:
  workflow_dispatch:

# Necessaire pour creer le tag et la release.
permissions:
  contents: write

jobs:
  construire:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Tout l'historique : le numero de version se deduit du nombre de
          # commits, qu'un clone superficiel ramenerait a 1.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dependances
        run: python -m pip install -r requirements-dev.txt

      - name: Lancer les tests
        run: python -m pytest tests/ -q

      # Le numero de version : « majeur.mineur » vient de SERIE, le dernier
      # nombre est le nombre de commits. Il ne peut donc que monter, et deux
      # envois ne tomberont jamais sur le meme numero. Pour ouvrir une
      # nouvelle serie, il suffit de changer SERIE dans le code.
      #
      # Le numero est ensuite inscrit dans le code, avant la compilation :
      # l'executable a besoin de connaitre le sien pour savoir, un jour,
      # qu'une version plus recente est parue.
      - name: Calculer le numero de version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref }}".StartsWith("refs/tags/v")) {
            $tag = "${{ github.ref_name }}"
          } else {
            $init = Get-Content papote/__init__.py -Raw
            $serie = [regex]::Match($init, 'SERIE = "(\d+\.\d+)"')
            if (-not $serie.Success) { throw "SERIE introuvable dans __init__.py" }
            $commits = (git rev-list --count HEAD).Trim()
            $tag = "v$($serie.Groups[1].Value).$commits"
          }
          Write-Host "version : $tag"
          "tag=$tag" >> $env:GITHUB_OUTPUT
          # L'executable doit connaitre son propre numero : c'est ainsi qu'il
          # sait, plus tard, qu'une version plus recente est parue.
          $numero = $tag.TrimStart('v')
          Set-Content -Path papote/version_compilee.py -Encoding utf8 -Value @(
            '# -*- coding: utf-8 -*-',
            '# Ecrit a la compilation par .github/workflows/executable.yml.',
            "VERSION = `"$numero`""
          )

      # Les images de l'installateur et l'icone du programme sortent des
      # memes pixels que les icones de la fenetre.
      - name: Dessiner l'icone et les images de l'installateur
        run: python outils/images_installateur.py

      - name: Compiler l'executable
        run: python -m PyInstaller --noconfirm --clean papote.spec

      # L'executable est compile en mode fenetre : sans redirection, il n'a
      # aucune sortie a offrir. « Start-Process -RedirectStandardOutput » lui
      # en fournit une, et attend qu'il ait fini. Attention, Start-Process
      # recolle ArgumentList avec des espaces : la phrase doit porter ses
      # propres guillemets pour rester un seul argument.
      - name: Verifier que l'executable corrige vraiment
        shell: pwsh
        run: |
          Start-Process -FilePath dist\Papote.exe `
            -ArgumentList '--texte', '"je sais pas si sa va marcher"' `
            -NoNewWindow -Wait `
            -RedirectStandardOutput sortie.txt -RedirectStandardError erreur.txt
          $sortie = "$(Get-Content sortie.txt -Raw -Encoding utf8)".Trim()
          if ($sortie -ne "je sais pas si ça va marcher") {
            Write-Host "--- sortie d'erreur ---"
            Get-Content erreur.txt -Raw -Encoding utf8
            throw "sortie inattendue : « $sortie »"
          }
          Write-Host "sortie conforme : $sortie"

      # WiX fabrique le MSI. La version lui est passee telle quelle : c'est
      # elle qui apparait dans la liste des programmes installes.
      # WiX est epingle en version 5 : a partir de la 6, l'outil demande
      # d'accepter l'« Open Source Maintenance Fee », un engagement de licence
      # qui ne se prend pas au detour d'un script de compilation. La 5 est
      # sous licence MIT, et comprend le meme format de recette.
      - name: Installer WiX
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2

      - name: Construire l'installateur
        shell: pwsh
        run: |
          $numero = "${{ steps.version.outputs.tag }}".TrimStart('v')
          wix build installateur/papote.wxs `
            -d Version=$numero `
            -bindpath dist -bindpath installateur `
            -ext WixToolset.UI.wixext `
            -ext WixToolset.Util.wixext `
            -culture fr-FR `
            -out dist/Papote.msi
          if (-not (Test-Path dist/Papote.msi)) { throw "le MSI n'a pas ete produit" }
          "{0:n1} Mo" -f ((Get-Item dist/Papote.msi).Length / 1MB)

      - uses: actions/upload-artifact@v4
        with:
          name: Papote
          path: |
            dist/Papote.exe
            dist/Papote.msi

      # Le tag doit etre pose sur le commit qu'on vient de compiler. Sans
      # « target_commitish », GitHub le pose sur la branche par defaut du
      # depot — qui n'est pas « main » ici : les huit tags precedents
      # designaient tous le meme vieux commit, et les notes de version
      # listaient les toutes premieres fusions au lieu des dernieres.
      - name: Publier la version
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Papote ${{ steps.version.outputs.tag }}
          body: |
            **Papote.msi** installe Papote proprement : menu Démarrer,
            désinstallation, et le choix de le lancer ou non avec Windows.
            Aucun droit administrateur n'est demandé.

            **Papote.exe** est le programme seul, à lancer tel quel — pour
            une clé USB, ou pour essayer sans rien installer.

            Dans les deux cas, une icône bleue apparaît près de l'horloge :
            écrivez, et le texte se corrige. Windows affichera un
            avertissement SmartScreen, faute de signature :
            *Informations complémentaires* → *Exécuter quand même*.
          generate_release_notes: true
          files: |
            dist/Papote.msi
            dist/Papote.exe
