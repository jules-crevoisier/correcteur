# Fabrique Correcteur.exe sur une machine Windows fournie par GitHub.
#
# A chaque envoi, sur n'importe quelle branche, l'executable est construit et
# depose dans l'onglet « Actions » du depot. Sur un tag « v1.2.3 », il est en
# plus publie dans les « Releases », pret a telecharger.
#
# Le declencheur ne filtre volontairement aucune branche : le depot n'a pas
# de branche « main », et une compilation manquee parce que le nom ne
# correspondait pas est exactement ce qu'on veut eviter.
name: Correcteur.exe

on:
  push:
  workflow_dispatch:

jobs:
  construire:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dependances
        run: python -m pip install -r requirements-dev.txt

      - name: Lancer les tests
        run: python -m pytest tests/ -q

      - name: Compiler l'executable
        run: python -m PyInstaller --noconfirm --clean correcteur.spec

      # L'executable est compile en mode fenetre : sans redirection, il n'a
      # aucune sortie a offrir. « Start-Process -RedirectStandardOutput » lui
      # en fournit une, et attend qu'il ait fini.
      - name: Verifier que l'executable corrige vraiment
        shell: pwsh
        run: |
          Start-Process -FilePath dist\Correcteur.exe `
            -ArgumentList '--texte', 'je sais pas si sa va marcher' `
            -NoNewWindow -Wait -RedirectStandardOutput sortie.txt
          $sortie = (Get-Content sortie.txt -Raw -Encoding utf8).Trim()
          if ($sortie -ne "je sais pas si ça va marcher") {
            throw "sortie inattendue : « $sortie »"
          }
          Write-Host "sortie conforme : $sortie"

      - uses: actions/upload-artifact@v4
        with:
          name: Correcteur-exe
          path: dist/Correcteur.exe

      - name: Publier la version
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Correcteur.exe
